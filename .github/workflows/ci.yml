name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: |
          set +e
          go vet ./... > /tmp/vet.log 2>&1
          status=$?
          echo "$status" > /tmp/vet-status
          cat /tmp/vet.log
          exit "$status"

      - name: Upload vet diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vet-log
          path: |
            /tmp/vet.log
            /tmp/vet-status

      - name: Build
        run: go build ./...

      - name: Test (race + coverage)
        run: go test -race -cover ./...
